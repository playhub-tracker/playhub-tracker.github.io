<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playhub Tracker Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0F172A', // Background principal
                            800: '#1E293B', // Background des cartes
                            700: '#334155'  // Bordures
                        }
                    }
                }
            }
        }
    </script>
    <!-- Icônes Phosphor pour un look moderne -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #60a5fa; }
        .tab-inactive { color: #94a3b8; }
        
        /* Toggle Switch Custom */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }
        .loader {
            border: 3px solid #334155;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen pb-10">

    <!-- En-tête -->
    <header class="bg-dark-800 border-b border-dark-700 sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-discord-logo text-[#5865F2] text-2xl"></i>
                <h1 class="font-bold text-lg text-white">Playhub Tracker</h1>
            </div>
            <button onclick="chargerDonnees()" id="btn-refresh" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-full transition-colors flex items-center justify-center h-10 w-10">
                <i class="ph ph-arrows-clockwise text-xl" id="icon-refresh"></i>
            </button>
        </div>
        
        <!-- Navigation Onglets -->
        <div class="max-w-3xl mx-auto px-4 flex gap-6 text-sm font-medium mt-2">
            <button onclick="switchTab('recap')" id="tab-recap" class="pb-3 tab-active">Récapitulatif</button>
            <button onclick="switchTab('tournois')" id="tab-tournois" class="pb-3 tab-inactive">Tournois</button>
            <button onclick="switchTab('joueurs')" id="tab-joueurs" class="pb-3 tab-inactive">Joueurs</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-6">

        <!-- Message d'état / Chargement -->
        <div id="status-message" class="hidden mb-6 p-3 rounded-lg text-sm bg-blue-900/30 text-blue-300 border border-blue-800 flex items-center gap-2">
            <span class="loader h-4 w-4"></span>
            <span id="status-text">Synchronisation avec Google Sheets...</span>
        </div>

        <!-- Section 1 : Bandeau de Monitoring -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-dark-800 rounded-xl p-4 border border-dark-700">
                <div class="text-xs font-bold tracking-wider text-slate-400 mb-1">DERNIÈRE RUN</div>
                <div class="flex items-end gap-3">
                    <div id="val-date-run" class="text-xl font-bold text-white tracking-wide">--/--/---- • --:--</div>
                </div>
                <div class="text-sm text-slate-400 mt-1"><span id="val-req-session" class="text-blue-400 font-bold">--</span> requêtes générées</div>
            </div>
            <div class="bg-dark-800 rounded-xl p-4 border border-dark-700 relative overflow-hidden">
                <div class="text-xs font-bold tracking-wider text-slate-400 mb-1">REQUÊTES AUJOURD'HUI</div>
                <div class="flex items-end gap-2">
                    <div id="val-req-jour" class="text-3xl font-black text-amber-400">--</div>
                    <div class="text-sm text-slate-400 font-medium mb-1 mb-1.5">/ 20 000</div>
                </div>
            </div>
        </div>

        <!-- Section 2 : Onglet RÉCAPITULATIF -->
        <div id="view-recap" class="block">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="ph-fill ph-broadcast"></i> Tournois suivis en direct
            </h2>
            <div id="liste-recap" class="space-y-4">
                <!-- Généré par JS -->
                <div class="text-center py-8 text-slate-500 text-sm italic">Cliquez sur actualiser pour charger les données.</div>
            </div>
        </div>

        <!-- Section 3 : Onglet TOURNOIS -->
        <div id="view-tournois" class="hidden">
            <div class="bg-dark-800 rounded-xl p-4 border border-dark-700 mb-6">
                <h3 class="font-bold text-white mb-3">Ajouter un tournoi</h3>
                <div class="flex gap-2">
                    <input type="text" id="input-new-tournoi" placeholder="ID (ex: 1254364) ou lien RPH..." class="flex-1 bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
                    <button onclick="ajouterTournoi()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Ajouter</button>
                </div>
            </div>

            <h3 class="text-sm font-bold text-slate-400 mb-3 tracking-wider">GESTION DES TOURNOIS</h3>
            <div class="bg-dark-800 rounded-xl border border-dark-700 divide-y divide-dark-700" id="liste-gestion-tournois">
                <!-- Généré par JS -->
            </div>
        </div>

        <!-- Section 4 : Onglet JOUEURS -->
        <div id="view-joueurs" class="hidden">
            <div class="bg-dark-800 rounded-xl p-4 border border-dark-700 mb-6">
                <h3 class="font-bold text-white mb-3">Ajouter un joueur</h3>
                <div class="flex gap-2">
                    <input type="text" id="input-new-joueur" placeholder="Pseudo PlayHub exact..." class="flex-1 bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
                    <button onclick="ajouterJoueur()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">Ajouter</button>
                </div>
            </div>

            <h3 class="text-sm font-bold text-slate-400 mb-3 tracking-wider">GESTION DES JOUEURS</h3>
            <div class="bg-dark-800 rounded-xl border border-dark-700 divide-y divide-dark-700" id="liste-gestion-joueurs">
                <!-- Généré par JS -->
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // URL MAGIQUE GOOGLE APPS SCRIPT (À REMPLACER)
        // ==========================================
        const SCRIPT_URL = 'URL_DE_TON_DEPLOIEMENT_GOOGLE_ICI'; 
        
        let donneesGlobales = { tournois: [], joueurs: [] };

        function switchTab(tabName) {
            ['recap', 'tournois', 'joueurs'].forEach(t => {
                document.getElementById('view-' + t).classList.add('hidden');
                document.getElementById('view-' + t).classList.remove('block');
                document.getElementById('tab-' + t).className = "pb-3 tab-inactive";
            });
            document.getElementById('view-' + tabName).classList.add('block');
            document.getElementById('view-' + tabName).classList.remove('hidden');
            document.getElementById('tab-' + tabName).className = "pb-3 tab-active";
        }

        function toggleLoader(show, text = "") {
            const el = document.getElementById('status-message');
            const txtEl = document.getElementById('status-text');
            const icon = document.getElementById('icon-refresh');
            
            if (show) {
                el.classList.remove('hidden');
                txtEl.textContent = text;
                icon.classList.add('animate-spin');
            } else {
                el.classList.add('hidden');
                icon.classList.remove('animate-spin');
            }
        }

        // --- LECTURE ---
        async function chargerDonnees() {
            if (SCRIPT_URL === 'URL_DE_TON_DEPLOIEMENT_GOOGLE_ICI') {
                alert("Attention: L'URL de Google Apps Script n'a pas été insérée dans le code de la page.");
                return;
            }

            toggleLoader(true, "Synchronisation avec Google Sheets...");
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                donneesGlobales = data;
                
                // Maj Compteurs
                document.getElementById('val-date-run').textContent = data.compteurs.date || "Aucune run";
                document.getElementById('val-req-session').textContent = data.compteurs.reqSession || "0";
                document.getElementById('val-req-jour').textContent = data.compteurs.reqJour || "0";

                renderRecap();
                renderGestionTournois();
                renderGestionJoueurs();

            } catch (error) {
                alert("Erreur de connexion à Google Sheets.");
                console.error(error);
            } finally {
                toggleLoader(false);
            }
        }

        // --- ECRITURE ---
        async function posterAction(action, payloadDonnees) {
            toggleLoader(true, "Enregistrement en cours...");
            try {
                const payload = { action: action, ...payloadDonnees };
                
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Obligatoire avec Apps Script pour éviter l'erreur CORS
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                // Recharge complet après modif (vu que c'est du no-cors, on ne lit pas la réponse, on recharge direct)
                setTimeout(() => chargerDonnees(), 1500);

            } catch (error) {
                alert("Erreur lors de l'enregistrement.");
                toggleLoader(false);
            }
        }

        function toggleItem(type, ligne, checkbox) {
            const estCoche = checkbox.checked;
            posterAction(type === 'tournoi' ? 'toggleTournoi' : 'toggleJoueur', { ligne: ligne, valeur: estCoche });
        }

        function ajouterTournoi() {
            const input = document.getElementById('input-new-tournoi');
            let val = input.value.trim();
            if(!val) return;
            
            // Extraction intelligente si c'est un lien complet
            const matchUrl = val.match(/events\/([^\/\?\s#]+)/i);
            if (matchUrl && matchUrl[1]) {
                val = matchUrl[1].trim();
            }

            input.value = "";
            posterAction('addTournoi', { id: val });
        }

        function ajouterJoueur() {
            const input = document.getElementById('input-new-joueur');
            const val = input.value.trim();
            if(!val) return;
            input.value = "";
            posterAction('addJoueur', { pseudo: val });
        }

        // --- AFFICHAGE (RENDERS) ---
        function renderRecap() {
            const container = document.getElementById('liste-recap');
            container.innerHTML = "";

            const tournoisActifs = donneesGlobales.tournois.filter(t => t.actif);
            
            if (tournoisActifs.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm italic">Aucun tournoi actif.</div>';
                return;
            }

            tournoisActifs.forEach(t => {
                // Trouver les joueurs inscrits à ce tournoi (et qui sont actifs)
                const joueursDuTournoi = donneesGlobales.joueurs.filter(j => 
                    j.actif && j.tournois.includes(t.id)
                );

                let badgeStatut = t.statut === "IN_PROGRESS" 
                    ? '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-green-900/40 text-green-400 border border-green-800">LIVE</span>'
                    : `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700">${t.statut || 'INCONNU'}</span>`;

                let htmlCard = `
                    <div class="bg-dark-800 rounded-xl border border-dark-700 overflow-hidden">
                        <div class="p-3 bg-dark-800 border-b border-dark-700 flex justify-between items-center">
                            <div class="font-bold text-white text-sm truncate pr-2">${t.nom}</div>
                            ${badgeStatut}
                        </div>
                        <div class="p-3 bg-dark-900/50">
                            <div class="flex flex-wrap gap-2">
                `;

                if (joueursDuTournoi.length > 0) {
                    joueursDuTournoi.forEach(j => {
                        htmlCard += `<span class="px-2.5 py-1 bg-slate-800 text-slate-300 text-xs font-medium rounded-md border border-slate-700 flex items-center gap-1.5"><i class="ph-fill ph-user text-slate-500"></i> ${j.pseudo}</span>`;
                    });
                } else {
                    htmlCard += `<span class="text-xs text-slate-500 italic">Aucun joueur suivi inscrit pour le moment.</span>`;
                }

                htmlCard += `</div></div></div>`;
                container.innerHTML += htmlCard;
            });
        }

        function createToggleRow(titre, sousTitre, actif, ligne, type) {
            return `
                <div class="p-4 flex items-center justify-between hover:bg-dark-900/50 transition-colors">
                    <div class="truncate pr-4">
                        <div class="font-medium text-white text-sm truncate">${titre}</div>
                        ${sousTitre ? `<div class="text-xs text-slate-500 truncate mt-0.5">${sousTitre}</div>` : ''}
                    </div>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="toggle-${type}-${ligne}" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-600 transition-all duration-300" ${actif ? 'checked' : ''} onchange="toggleItem('${type}', ${ligne}, this)"/>
                        <label for="toggle-${type}-${ligne}" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-700 cursor-pointer transition-colors duration-300"></label>
                    </div>
                </div>
            `;
        }

        function renderGestionTournois() {
            const container = document.getElementById('liste-gestion-tournois');
            container.innerHTML = "";
            donneesGlobales.tournois.forEach(t => {
                container.innerHTML += createToggleRow(t.nom, `ID: ${t.id}`, t.actif, t.ligne, 'tournoi');
            });
            if(donneesGlobales.tournois.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-sm text-slate-500 italic">Aucun tournoi enregistré.</div>';
            }
        }

        function renderGestionJoueurs() {
            const container = document.getElementById('liste-gestion-joueurs');
            container.innerHTML = "";
            donneesGlobales.joueurs.forEach(j => {
                container.innerHTML += createToggleRow(j.pseudo, null, j.actif, j.ligne, 'joueur');
            });
            if(donneesGlobales.joueurs.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-sm text-slate-500 italic">Aucun joueur enregistré.</div>';
            }
        }

        // Lancement au chargement (si l'URL est configurée)
        if (SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbxaGtBaAC_V-j8fZ1Nrz80pmcJn7Ru8FBo_5p9VZJtf5nlb39HcWyYMI4DjDwDrFdL5/exec') {
            chargerDonnees();
        }

    </script>
</body>
</html>
